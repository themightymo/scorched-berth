<body>
  <a class="skip" href="#screen">Skip to content</a>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">▲</span> SCORCHED BERTH <small>ARTILLERY COMMAND</small></div>
      <div class="topbar-status" id="topbar-status" aria-hidden="true"></div>
      <nav class="topbar-actions" aria-label="Quick actions">
        <button class="tb-btn" id="btn-pause" type="button" hidden aria-keyshortcuts="P Escape">❚❚ <span>Pause</span></button>
        <button class="tb-btn" id="btn-speed" type="button" hidden aria-keyshortcuts="S" aria-label="Battle speed, normal">×1 <span>Speed</span></button>
        <button class="tb-btn" id="btn-help" type="button" aria-keyshortcuts="H">? <span>Manual</span></button>
        <button class="tb-btn" id="btn-settings" type="button">⚙ <span>Settings</span></button>
        <button class="tb-btn" id="btn-mute" type="button" aria-pressed="false" aria-keyshortcuts="M">♪ <span>Sound</span></button>
      </nav>
    </header>

    <main id="screen" class="screen" tabindex="-1"></main>

    <section id="battle" class="battle" hidden aria-label="Battle">
      <div class="field-frame" id="field-frame">
        <canvas id="field" width="1400" height="560" role="img" aria-label="Battlefield"></canvas>
        <div class="aim-swipe-overlay" id="aim-swipe-overlay" aria-hidden="true">
          <div class="swipe-angle"><span>ANGLE</span><i></i><output id="swipe-angle-value">45°</output></div>
          <div class="swipe-power"><span>POWER</span><i></i><output id="swipe-power-value">65</output></div>
          <p>SWIPE ↔ ANGLE · ↕ POWER</p>
        </div>
        <div class="crt" aria-hidden="true"></div>
        <div class="banner" id="banner" aria-hidden="true"></div>
        <div class="field-overlay" id="field-overlay" hidden></div>
      </div>

      <button type="button" class="mobile-hud-toggle" id="mobile-hud-toggle" aria-controls="hud" aria-expanded="false">
        <span aria-hidden="true">☰</span> <span id="mobile-hud-label">LOADOUT</span>
      </button>
      <div class="hud" id="hud">
        <button type="button" class="mobile-hud-close" id="mobile-hud-close">DONE <span aria-hidden="true">×</span></button>
        <div class="hud-turn box" id="hud-turn"></div>
        <div class="hud-aim box" id="hud-aim">
          <div class="aim-row">
            <label for="in-angle">ANGLE</label>
            <button type="button" class="nudge" data-nudge="angle:1" aria-label="Rotate barrel left">◄</button>
            <input id="in-angle" type="range" min="0" max="180" step="1" value="45" aria-describedby="angle-help">
            <button type="button" class="nudge" data-nudge="angle:-1" aria-label="Rotate barrel right">►</button>
            <output id="out-angle" for="in-angle">45°</output>
          </div>
          <div class="aim-row">
            <label for="in-power">POWER</label>
            <button type="button" class="nudge" data-nudge="power:-1" aria-label="Decrease power">▼</button>
            <input id="in-power" type="range" min="10" max="100" step="1" value="65">
            <button type="button" class="nudge" data-nudge="power:1" aria-label="Increase power">▲</button>
            <output id="out-power" for="in-power">65</output>
          </div>
          <p class="keyhint" id="angle-help">←/→ angle · ↑/↓ power · hold Shift ×5</p>
          <p class="touchhint">Swipe anywhere on the battlefield: left/right changes angle, up/down changes power.</p>
        </div>
        <fieldset class="hud-weapons box" id="hud-weapons">
          <legend>PAYLOAD <span class="keyhint" id="weapon-keyhint">1–6 · [ ]</span></legend>
          <div class="weapon-list" id="weapon-list" role="radiogroup" aria-label="Payload"></div>
          <p class="weapon-detail" id="weapon-detail"></p>
        </fieldset>
        <div class="hud-fire box">
          <button type="button" class="btn-fire" id="btn-fire" aria-keyshortcuts="Space Enter">FIRE <kbd>SPACE</kbd></button>
          <div class="wind-readout" id="wind-readout"></div>
        </div>
        <fieldset class="hud-defense box" id="hud-defense">
          <legend>DEFENSE <span class="keyhint">D · deploys when your turn ends</span></legend>
          <div class="defense-list" id="defense-list" role="radiogroup" aria-label="Defense to deploy this turn"></div>
          <p class="weapon-detail" id="defense-detail"></p>
        </fieldset>
        <div class="hud-roster box" id="hud-roster" aria-label="Tanks"></div>
        <div class="hud-log box">
          <h2 class="box-title">BATTLE LOG</h2>
          <ol class="log" id="log" aria-live="polite" aria-relevant="additions"></ol>
        </div>
      </div>
    </section>
  </div>

  <div class="sr-only" id="announcer" aria-live="assertive" aria-atomic="true"></div>

  <dialog id="dlg-help" class="dialog" aria-labelledby="help-title"></dialog>
  <dialog id="dlg-settings" class="dialog" aria-labelledby="settings-title"></dialog>
  <dialog id="dlg-confirm" class="dialog dialog-small" aria-labelledby="confirm-title"></dialog>

</body>
</html>
